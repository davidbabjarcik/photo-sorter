<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Roztriedi fotky z priečinka lokálne v prehliadači – nič sa neuploaduje." />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>Photo Sorter</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="./icon.svg" alt="" width="28" height="28" /> Photo Sorter</div>
      <div class="topbar-actions">
        <span id="device" class="pill" hidden></span>
        <button id="btn-theme" class="ghost" title="Prepnúť svetlý / tmavý režim">◐</button>
        <button id="btn-settings" class="ghost" title="Nastavenia">⚙ Nastavenia</button>
      </div>
    </header>

    <main>
      <h1 id="title">Moje fotky sú totálny chaos.</h1>
      <p id="subtitle" class="muted">Vyber priečinok s fotkami. Všetko beží lokálne v prehliadači – nič sa nikam neuploaduje.</p>

      <section class="statsbar">
        <div class="stat"><span class="label">Spolu súborov</span><span class="value" id="st-total">0</span></div>
        <div class="stat"><span class="label">Fotky</span><span class="value" id="st-photos">0</span></div>
        <div class="stat"><span class="label">Screenshoty a iné</span><span class="value" id="st-other">0</span></div>
        <div class="stat"><span class="label">Vytvorené priečinky</span><span class="value" id="st-folders">0</span></div>
        <button class="stat stat-btn" id="st-dupes-btn" title="Zobraziť duplikáty">
          <span class="label">Nájdené duplikáty</span><span class="value"><span id="st-dupes">0</span> <small id="st-saved" class="muted"></small></span>
        </button>
        <button class="stat stat-btn" id="st-cams-btn" title="Čím bolo fotené">
          <span class="label">Fotoaparáty</span><span class="value" id="st-cams">0</span>
        </button>
        <div class="actions">
          <button id="btn-pick" class="secondary">Vybrať priečinok</button>
          <button id="btn-pause" class="secondary" hidden>Pauza</button>
          <button id="btn-sort" class="yellow">Roztriediť</button>
        </div>
      </section>
      <div id="resume-row" class="resume" hidden></div>
      <div id="demo-row" class="resume" hidden><button id="btn-demo" class="secondary">Načítať testovací priečinok</button></div>

      <section class="stage">
        <div class="left">
          <canvas id="ball" aria-label="Guľa z náhľadov fotiek"></canvas>
          <div id="progress" class="progress">&nbsp;</div>
          <div class="bar"><div id="bar-fill"></div></div>
          <div id="status" class="muted small">&nbsp;</div>
        </div>
        <div class="right">
          <div id="cards" class="cards"></div>
        </div>
      </section>
    </main>

    <div class="searchbar">
      <div class="search-inner">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Hľadať vo fotkách, napr. „svetlá na stage“ alebo „torta“" autocomplete="off" />
        <kbd>/</kbd>
      </div>
      <div id="search-results" class="search-results" hidden></div>
    </div>

    <div id="fly-layer" aria-hidden="true"></div>

    <dialog id="dlg-settings" class="dlg wide"></dialog>
    <dialog id="dlg-plan" class="dlg wide"></dialog>
    <dialog id="dlg-dupes" class="dlg wide"></dialog>
    <dialog id="dlg-folder" class="dlg wide"></dialog>
    <dialog id="dlg-cams" class="dlg wide"></dialog>
    <dialog id="dlg-photo" class="dlg"></dialog>
    <dialog id="dlg-confirm" class="dlg"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

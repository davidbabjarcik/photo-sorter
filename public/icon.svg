  <!-- predná časť priečinka -->
  <path d="M84 250c0-12 10-22 22-22h300c12 0 22 10 22 22l-14 128c-1 13-12 22-24 22H122c-12 0-23-9-24-22z" fill="url(#front)" filter="url(#sh)"/>
  <rect x="200" y="296" width="112" height="16" rx="8" fill="#141414" opacity="0.18"/>

  <!-- AI iskra -->
  <path d="M404 92c4 22 14 32 36 36-22 4-32 14-36 36-4-22-14-32-36-36 22-4 32-14 36-36z" fill="#ffd60a"/>
  <path d="M444 168c2 10 6 14 16 16-10 2-14 6-16 16-2-10-6-14-16-16 10-2 14-6 16-16z" fill="#fafafa" opacity="0.9"/>

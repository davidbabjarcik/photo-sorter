    <rect x="136" y="128" width="150" height="176" rx="14" fill="#fafafa"/>
    <rect x="148" y="140" width="126" height="120" rx="8" fill="url(#sky1)"/>
    <path d="M148 240l38-44 30 30 22-22 36 36v20H148z" fill="#2f7d4f"/>
    <circle cx="246" cy="168" r="12" fill="#fff6b0"/>
  </g>

  <!-- fotka 2 (vpredu, naklonená doprava) -->
  <g filter="url(#sh)" transform="rotate(10 300 220)">
    <rect x="228" y="112" width="150" height="176" rx="14" fill="#fafafa"/>
    <rect x="240" y="124" width="126" height="120" rx="8" fill="url(#sky2)"/>
    <circle cx="303" cy="200" r="26" fill="#ff6a3d"/>
    <path d="M240 222c30-12 60-12 126 0v22H240z" fill="#3b2a5a"/>
